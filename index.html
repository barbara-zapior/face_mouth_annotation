<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Annotation (Local Only)</title>
  <style>
    body { font-family: sans-serif; text-align:center; padding:20px; }
    canvas { border:1px solid #999; display:block; margin:10px auto; }
    button { margin:5px; padding:8px 12px; }
  </style>
</head>
<body>
  <h2>Draw two rectangles: eyes (blue) and mouth (red)</h2>
  <canvas id="canvas" width="640" height="480"></canvas><br>
  <button id="clear">Clear</button>
  <button id="download">Download Rectangles</button>

  <script>
    const img = new Image();
    img.src = "Picture3.jpg"; // 👈 Put your image file in same folder OR replace with an online URL
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let drawnRects = [], tempRect = null, drawing = false, startX, startY;

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      drawnRects.forEach(r => {
        ctx.strokeStyle = r.label === "eyes" ? "blue" : "red";
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      });
      if (tempRect) {
        ctx.setLineDash([5]);
        ctx.strokeStyle = tempRect.label === "eyes" ? "blue" : "red";
        ctx.strokeRect(tempRect.x, tempRect.y, tempRect.w, tempRect.h);
        ctx.setLineDash([]);
      }
    }

    img.onload = () => redraw();

    canvas.addEventListener("mousedown", e => {
      drawing = true; startX = e.offsetX; startY = e.offsetY;
    });
    canvas.addEventListener("mousemove", e => {
      if (!drawing) return;
      const x = Math.min(startX, e.offsetX), y = Math.min(startY, e.offsetY);
      const w = Math.abs(e.offsetX - startX), h = Math.abs(e.offsetY - startY);
      const label = drawnRects.length === 0 ? "eyes" : "mouth";
      tempRect = { x, y, w, h, label }; redraw();
    });
    canvas.addEventListener("mouseup", () => {
      if (!drawing) return;
      drawing = false;
      if (!tempRect) return;
      drawnRects.push(tempRect); tempRect = null; redraw();
    });

    document.getElementById("clear").onclick = () => { drawnRects = []; redraw(); };
    document.getElementById("download").onclick = () => {
      const data = JSON.stringify(drawnRects, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "rectangles.json";
      a.click();
    };
  </script>
</body>
</html>
