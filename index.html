<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Annotation (Screen-Independent)</title>
  <style>
    body { font-family: sans-serif; text-align:center; padding:20px; }
    canvas { border:1px solid #999; display:block; margin:10px auto; }
    button { margin:5px; padding:8px 12px; font-size:16px; }
  </style>
</head>
<body>
  <h2>Draw two rectangle AOIs: eyes (blue) and mouth (red)</h2>
  <canvas id="canvas" width="640" height="480"></canvas><br>
  <button id="clear">Clear</button>
  <button id="download">Download Rectangles</button>

  <script>
    const img = new Image();
    img.src = "Picture3.jpg"; // 👈 Place your image in same folder OR use an online URL
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let drawnRects = [];
    let tempRect = null;
    let drawing = false;
    let startX, startY;

    // Draw everything
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      drawnRects.forEach(r => {
        ctx.strokeStyle = r.label === "eyes" ? "blue" : "red";
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      });

      if (tempRect) {
        ctx.setLineDash([5]);
        ctx.strokeStyle = tempRect.label === "eyes" ? "blue" : "red";
        ctx.strokeRect(tempRect.x, tempRect.y, tempRect.w, tempRect.h);
        ctx.setLineDash([]);
      }
    }

    img.onload = () => redraw();

    // Mouse events
    canvas.addEventListener("mousedown", e => {
      if (drawnRects.length >= 2) return; // limit to 2 rectangles
      drawing = true;
      startX = e.offsetX;
      startY = e.offsetY;
    });

    canvas.addEventListener("mousemove", e => {
      if (!drawing) return;

      const x = Math.min(startX, e.offsetX);
      const y = Math.min(startY, e.offsetY);
      const w = Math.abs(e.offsetX - startX);
      const h = Math.abs(e.offsetY - startY);
      const label = drawnRects.length === 0 ? "eyes" : "mouth";
      tempRect = { x, y, w, h, label };
      redraw();
    });

    canvas.addEventListener("mouseup", () => {
      if (!drawing || !tempRect) return;
      drawing = false;
      drawnRects.push(tempRect);
      tempRect = null;
      redraw();
    });

    // Clear button
    document.getElementById("clear").onclick = () => {
      drawnRects = [];
      redraw();
    };

    // Download button with normalized coordinates
    document.getElementById("download").onclick = () => {
      if (drawnRects.length !== 2) {
        alert("Please draw both rectangles: eyes and mouth.");
        return;
      }

      const normalized = drawnRects.map(r => ({
        x: r.x / canvas.width,
        y: r.y / canvas.height,
        w: r.w / canvas.width,
        h: r.h / canvas.height,
        label: r.label
      }));

      const data = JSON.stringify(normalized, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "rectangles.json";
      a.click();
    };
  </script>
</body>
</html>
